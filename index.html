<!DOCTYPE html>
<html lang="es" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería Bodrio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tipografía del sistema Apple y físicas de animación fluidas */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            /* Simulación del fondo abstracto azul/púrpura de macOS */
            background-image: radial-gradient(circle at top left, rgba(10, 132, 255, 0.15), transparent 40%),
                              radial-gradient(circle at bottom right, rgba(191, 90, 242, 0.15), transparent 40%);
            background-attachment: fixed;
        }
        /* Material de cristal translúcido (Glassmorphism) */
        .apple-glass {
            background-color: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .apple-button {
            transition: transform 0.1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.1s;
        }
        .apple-button:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 sm:p-12">

    <!-- Encabezado Minimalista -->
    <header class="w-full max-w-4xl text-center mb-12">
        <h1 class="text-5xl font-bold tracking-tight mb-2">Bodrio</h1>
        <p class="text-gray-400 text-lg">Meme rancio, café de especialidad.</p>
    </header>

    <!-- Contenedor Principal Dividido -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Sección de Menú -->
        <section class="apple-glass rounded-3xl p-6 shadow-2xl">
            <h2 class="text-2xl font-semibold mb-6">Selección</h2>
            
            <div class="space-y-4">
                <!-- Artículo 1 -->
                <div class="flex justify-between items-center p-4 bg-white/5 rounded-2xl border border-white/5">
                    <div>
                        <h3 class="font-medium text-lg">Latte Cheems</h3>
                        <p class="text-sm text-gray-400">$65.00 MXN</p>
                    </div>
                    <button onclick="agregarAlCarrito('Latte Cheems', 65)" class="apple-button bg-[#0A84FF] text-white px-4 py-2 rounded-full font-medium text-sm">
                        Agregar
                    </button>
                </div>

                <!-- Artículo 2 -->
                <div class="flex justify-between items-center p-4 bg-white/5 rounded-2xl border border-white/5">
                    <div>
                        <h3 class="font-medium text-lg">Cold Brew Drake</h3>
                        <p class="text-sm text-gray-400">$75.00 MXN</p>
                    </div>
                    <button onclick="agregarAlCarrito('Cold Brew Drake', 75)" class="apple-button bg-[#0A84FF] text-white px-4 py-2 rounded-full font-medium text-sm">
                        Agregar
                    </button>
                </div>
            </div>
        </section>

        <!-- Sección de Carrito -->
        <section class="apple-glass rounded-3xl p-6 shadow-2xl flex flex-col">
            <h2 class="text-2xl font-semibold mb-6">Tu Pedido</h2>
            
            <!-- Lista del Carrito -->
            <div id="lista-carrito" class="flex-1 overflow-y-auto space-y-3 mb-6 min-h-[150px]">
                <p class="text-gray-500 text-center mt-10">El carrito está vacío.</p>
            </div>

            <!-- Total y Botón de Pago -->
            <div class="border-t border-white/10 pt-4 mt-auto">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-xl font-medium">Total</span>
                    <span id="total-carrito" class="text-2xl font-bold">$0.00</span>
                </div>
                <button id="btn-pagar" onclick="enviarOrdenAlBackend()" class="apple-button w-full bg-[#0A84FF] hover:bg-blue-500 text-white py-3 rounded-xl font-semibold text-lg flex justify-center items-center gap-2">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Pagar y Enviar
                </button>
                <p id="mensaje-estado" class="text-center text-sm mt-3 hidden"></p>
            </div>
        </section>

    </main>

    <script>
        // VARIABLE IMPORTANTE: Reemplaza esta URL con la que te asigne Render.com
        const RENDER_BACKEND_URL = "https://cafeteria-pueba.onrender.com/api/checkout";

        let carrito = [];
        let total = 0;

        function agregarAlCarrito(nombre, precio) {
            const itemExistente = carrito.find(item => item.nombre === nombre);
            if (itemExistente) {
                itemExistente.cantidad += 1;
            } else {
                carrito.push({ nombre: nombre, precio: precio, cantidad: 1 });
            }
            actualizarUI();
        }

        function actualizarUI() {
            const lista = document.getElementById('lista-carrito');
            const totalUI = document.getElementById('total-carrito');
            
            lista.innerHTML = '';
            total = 0;

            if (carrito.length === 0) {
                lista.innerHTML = '<p class="text-gray-500 text-center mt-10">El carrito está vacío.</p>';
            } else {
                carrito.forEach((item, index) => {
                    total += item.precio * item.cantidad;
                    lista.innerHTML += `
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-gray-300"><span class="text-[#0A84FF] font-bold mr-2">${item.cantidad}x</span> ${item.nombre}</span>
                            <span class="font-medium">$${item.precio * item.cantidad}.00</span>
                        </div>
                    `;
                });
            }
            totalUI.innerText = `$${total}.00`;
        }

        // Función central que realiza la petición HTTP al servidor en Python
        async function enviarOrdenAlBackend() {
            if (carrito.length === 0) {
                mostrarMensaje("Agrega al menos un producto.", "text-orange-400");
                return;
            }

            const botonPagar = document.getElementById('btn-pagar');
            botonPagar.disabled = true;
            botonPagar.innerText = "Procesando...";

            // Estructurar los datos (El JSON que leerá Flask)
            const orden = {
                usuario: "Sebastián",
                total: total,
                carrito: carrito
            };

            try {
                // El navegador ejecuta la petición al servidor
                const respuesta = await fetch(RENDER_BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orden)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    mostrarMensaje("¡Orden enviada con éxito!", "text-[#30D158]");
                    carrito = []; // Vaciar carrito
                    actualizarUI();
                } else {
                    mostrarMensaje("Error del servidor: " + datos.error, "text-[#FF453A]");
                }
            } catch (error) {
                console.error("Fallo de conexión:", error);
                mostrarMensaje("Error de red. ¿El servidor en Render está encendido?", "text-[#FF453A]");
            } finally {
                botonPagar.disabled = false;
                botonPagar.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Pagar y Enviar
                `;
            }
        }

        function mostrarMensaje(texto, colorClass) {
            const msj = document.getElementById('mensaje-estado');
            msj.className = `text-center text-sm mt-3 ${colorClass} block`;
            msj.innerText = texto;
            setTimeout(() => { msj.classList.add('hidden'); }, 4000);
        }
    </script>
</body>
</html>
